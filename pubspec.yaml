name: bgeo_background_geolocation
description: Reliable background geolocation for Flutter (BGeo engine) — iOS & Android. Motion-aware tracking, offline HTTP queue, geofences, headless events.
version: 0.2.2
homepage: https://bgeo.dev
repository: https://github.com/dc-bgeo/flutter_background_geolocation

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bgeo.flutter
        pluginClass: BGeoFlutterPlugin
      ios:
        pluginClass: BGeoFlutterPlugin
